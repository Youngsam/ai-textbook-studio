[project]
name = "ai-textbook-studio"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.34", "sqlalchemy>=2.0",
  "alembic>=1.14", "pydantic-settings>=2.7", "python-multipart>=0.0.20",
  "pymupdf>=1.25,<2", "openai>=1.66",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
